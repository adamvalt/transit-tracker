name: Build Firmware
on:
  push:
    branches: ["**"]
    paths:
      - "firmware/**"
      - ".github/workflows/build-firmware.yml"
  workflow_dispatch:
    inputs:
      timezone:
        description: "IANA time zone for night mode hours"
        default: "Europe/Prague"

jobs:
  build:
    name: Build Firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ESPHome
        run: pip install --user esphome==2026.9.1

      # project_version stays "dev" so these builds never auto-update from the upstream manifest
      - name: Compile Firmware
        working-directory: firmware
        env:
          TIMEZONE: ${{ inputs.timezone || 'Europe/Prague' }}
        run: |
          esphome -s pixolletta_file_path "fonts/Pixolletta8px.ttf" -s timezone "$TIMEZONE" compile transit-tracker.yaml
          mkdir -p bin
          cp .esphome/build/transit-tracker/build/firmware.factory.bin bin/firmware.factory.bin
          cp .esphome/build/transit-tracker/build/firmware.ota.bin bin/firmware.ota.bin

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: "firmware/bin/*.bin"
